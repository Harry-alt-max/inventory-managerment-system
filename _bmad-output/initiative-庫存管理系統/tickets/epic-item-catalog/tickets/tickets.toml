title = "倉庫與庫存位置"
description = "建立倉庫（唯一編碼）與其下庫存位置（同倉位置代碼唯一）；提供某倉所有位置及其存放商品與數量的查詢；位置代碼格式採暫定值 A-03，與公司既有編碼規則對齊的工作延後。"
verify = "重複的倉庫編碼或同倉位置代碼被拒絕（409）並指回既有資料；可列出某倉所有位置及其商品與數量。"
