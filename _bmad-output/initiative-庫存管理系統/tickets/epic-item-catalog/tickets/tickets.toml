# E2 商品、供應商、倉庫位置與採購批次 — story 拆解（build order）
# 2026-10-21 裁減為「主路徑」：供應商與批次各自獨立管理頁、位置代碼格式待確認項延後。

[[entry]]
id = 1
type = "story"
title = "商品主檔與進貨批次"
description = "建立商品主檔（商品編號 INV- + 6 碼由 DB sequence 產生、名稱、供應商名稱、建議售價、預計毛利）與進貨批次（供應商、採購批次流水號 PO-YYYYMMDD-序號、單價、數量、總價自動計算、採購日期）；提供商品名稱的部分關鍵字查詢（精確相同優先）。批次原始單價與數量原樣保存供 FIFO 結算使用。"
verify = "建立商品後取得系統產生的編號；缺名稱或供應商時拒絕儲存並指出缺哪一欄；建立批次時總價等於單價 × 數量、缺單價或數量不可儲存；同名商品查詢可找到且精確名稱排在前面。"
covers = ["R4", "R5", "R7", "R9"]
after = ["epic-platform-baseline"]
hitl = false
risk = "medium"

