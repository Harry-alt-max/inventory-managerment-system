# E1 平台基線、帳號與角色權限 — story 拆解（build order）
# 表格順序是建置順序，不是 id。id 永久有效，不重用。
# 排序決定（2026-10-21，使用者）：tracer bullet 後接「最不確定」的守衛規則基線，
# 其前置「測試紀律」一併提前，形成安全網 → 高風險規則 → 可見進展的順序。

[[entry]]
id = 1
type = "story"
title = "專案骨架與第一次連線打通"
description = "建立 Django 專案與四層 settings（base／dev／test／prod，prod 缺 SECRET_KEY 或允許主機即啟動失敗）、以 PGPASSFILE 連 AILearn、第一組 migration、core/exceptions.py 與單一 DRF exception handler（錯誤一律回 {code, detail, field_errors}）、/api/v1/health 端點、Vite + React + TS + Tailwind + shadcn 前端骨架與應用外框（側欄依角色顯隱、頂列含語系切換與使用者選單、登出）、以 zh-TW／en-US 起步的 message catalog、WhiteNoise 靜態檔與 waitress 啟動方式；所有資料存取以參數化查詢書寫。"
verify = "開發者啟動後端與前端後，開啟前端首頁可看到後端回應的版本字串，切換語系會改變畫面文字；改以 waitress 啟動並 build 前端後開啟首頁，同樣看得到版本字串。"
covers = []
after = []
hitl = true
risk = "medium"

