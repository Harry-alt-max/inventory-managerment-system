[[entry]]
id = 6
type = "story"
title = "操作人員機制與共用守衛規則基線"
description = "交付 R3：actor 為 use case 的顯式參數（禁 thread-local），view 必須傳登入者帳號代號作為 actor，紀錄上保存帳號代號快照（AD-32）；於 core 建立共用守衛規則基線——交易邊界、僅追加、庫存不為負、銷售扣減唯一入口、跨倉變動必須有調貨單，以規則介面交付、不建庫存表（實體套用於 E3/E4）；並建立日誌基線（request id、actor id、use case 名稱，不記錄憑證）。"
verify = "以 core 層守衛規則與測試替身驗證：非銷貨單的銷售用途扣減被拒絕、無調貨單的跨倉異動被拒絕、庫存不會變負、交易中途失敗整筆回滾、交易類資料的 update/delete 在 manager 層被封鎖且不使用 is_active 軟刪除；另以帶 actor 的寫入 use case 驗證紀錄的 actor 快照非空且等於登入者，停用帳號後既有紀錄的 actor 快照不變。"
covers = ["R3"]
after = [1, 7]
hitl = false
risk = "high"

[[entry]]
id = 2
type = "story"
title = "登入、登出與未認證處理"
description = "交付 R1 的帳號密碼登入部分：以 session + CSRF 完成登入與登出（AD-6），密碼以 Django 預設雜湊器儲存且禁用可降級演算法（AD-6）；/api/v1/* 未認證回 401 且 body 為 AD-7 錯誤包絡（code 例如 auth.unauthenticated），由前端導向 /login 並記錄 return_to，登入後回到原頁；建立 /login 登入頁（依 DESIGN.md 登入表單與 EXPERIENCE.md 登入表單行為，含失敗次數與鎖定狀態呈現）。"
verify = "以有效帳號登入成功並看到自己的角色；登出後再請求受保護端點得到 401 並被導回登入頁，return_to 保留原路徑。"
covers = ["R1"]
after = [1]
hitl = false
risk = "low"

[[entry]]
id = 3
type = "story"
title = "登入失敗計數與帳號鎖定"
description = "交付 R1 的錯誤處理與鎖定部分：失敗計數存於 DB，同一帳號第 5 次失敗鎖定 15 分鐘（UTC 計算）；帳號不存在與密碼錯誤回應同一訊息「帳號或密碼錯誤」與同一碼 auth.invalid_credentials（不透露帳號是否存在），已鎖定回應 auth.locked 並顯示剩餘鎖定時間。"
verify = "連續 5 次密碼錯誤後，即使密碼正確也無法登入，直到鎖定期滿；查詢不存在的帳號與查詢錯誤密碼得到相同訊息與相同錯誤碼。"
covers = ["R1"]
after = [2]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "四種角色權限與越權拒絕"
description = "交付 R2：把 PRD FR-2 權限矩陣的全部列展開為 permission codename，集中於 core/permissions.py 宣告（含 E2～E4 模組的列，view 宣告所需權限的動作由各 epic 落地）；越權請求回 403 與統一錯誤包絡；會計角色唯讀；並以 seed 產生四種角色各一個測試帳號。"
verify = "四種角色各有一個測試帳號可登入並取得符合其角色的權限集合；以會計角色呼叫任一寫入端點被拒絕，以採購角色呼叫倉管端點被拒絕，角色允許的操作則成功。"
covers = ["R2"]
after = [2]
hitl = false
risk = "medium"

[[entry]]
id = 5
type = "story"
title = "帳號生命週期"
description = "交付 R20：倉管可建立帳號、指派四種角色之一、停用帳號並重設密碼；停用帳號不可再登入，帳號及其既有關聯資料保留不刪；建立 /admin/accounts 帳號與角色頁（表格 + 抽屜編輯、角色四選一單選、停用需二次確認對話框）。"
verify = "倉管建立帳號並指派角色後該帳號可登入；重設密碼後舊密碼失效且下次登入須改密；停用帳號後登入被拒絕，而其既有資料不被刪除。"
covers = ["R20"]
after = [4]
hitl = false
risk = "low"

