# 庫存管理系統 — initiative 的 epic 拆解（草稿，build order）
# 表格順序是建置順序，不是 id。id 永久有效，不重用。

[[epic]]
id = 1
slug = "epic-platform-baseline"
title = "平台基線、帳號與角色權限"
description = "建立專案骨架、AILearn 連線設定與資料庫 schema 基線（migration 工具），並完成後台登入、四種角色權限；同時提供操作人員（登入者）帶入機制與共用守衛規則基線（交易邊界、僅追加寫入、銷售扣減唯一入口、跨倉變動必須有調貨單），供後續庫存異動與銷貨紀錄沿用；已在本機部署環境跑通一次最小路徑。"
covers = ["R1", "R2", "R3", "R20"]
after = []

[[epic]]
id = 2
slug = "epic-item-catalog"
title = "商品、供應商、倉庫位置與採購批次"
description = "商品、供應商、倉庫與位置、採購批次都可建檔與查詢（受 E1 的登入與角色權限控管），並提供名稱查詢索引、批次成本與建議售價給入庫（E3）與銷售（E4）引用；商品主檔預留可空的水位欄位。"
covers = ["R4", "R7", "R9", "R10"]
after = [{ epic = 1, needs = "專案骨架、AILearn 連線設定與資料庫 schema 基線" }, { epic = 1, needs = "登入與角色權限（誰能建檔、誰能看）" }]

[[epic]]
id = 3
slug = "epic-stock-and-replenishment"
title = "庫存異動、跨倉調度與補貨水位"
description = "入庫、領用、同倉移轉、跨倉調貨都留下可追溯的異動紀錄（操作人員沿用 E1 的登入者機制、單價取自 E2 的採購批次、交易與僅追加規則沿用 E1 的守衛規則基線），並提供可定位位置與庫存數量的商品查詢（R5）與低於水位的待補貨清單。"
covers = ["R5", "R6", "R8", "R11", "R12", "R13", "R14"]
after = [{ epic = 1, needs = "登入與角色權限（倉管可入庫／領用／移轉、採購可設水位與看待補貨清單）與守衛規則基線" }, { epic = 2, needs = "商品主檔與名稱查詢索引、批次（單價、數量）與庫存位置主檔、商品主檔的水位欄位" }]

[[epic]]
id = 4
slug = "epic-sales-and-margin"
title = "銷售、毛利與可售查詢"
description = "銷售在成交當下完成查詢、組合、折扣與毛利試算（成本取自 E2 的批次、可用量與扣減沿用 E3 的庫存流程與調貨單、操作人員沿用 E1 的登入者機制），銷貨扣減庫存並留下可沖銷的銷貨紀錄；本 epic 只提供「建議調貨來源倉庫」的查詢輸出，調貨單的建立與移出／移入異動由 E3 執行，本 epic 不直接改動庫存。"
covers = ["R15", "R16", "R17", "R18", "R19"]
after = [{ epic = 1, needs = "登入與角色權限（銷售可建銷貨單、會計唯讀查核）與操作人員帶入機制" }, { epic = 2, needs = "批次成本與建議售價" }, { epic = 3, needs = "庫存扣減與異動紀錄（含交易與僅追加寫入規則）" }, { epic = 3, needs = "各倉可用量與跨倉調貨單" }]
