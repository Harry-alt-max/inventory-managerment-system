[[entry]]
id = 1
type = "story"
title = "入庫與庫存異動紀錄"
description = "建立庫存現況（商品 × 位置 × 數量）與僅追加的庫存異動紀錄；提供入庫作業（商品、位置、數量、批次，單價取自批次不得另輸入），入庫在同一交易內更新庫存現況並產生一筆含操作人員與批次的異動；庫存數量不得為負。"
