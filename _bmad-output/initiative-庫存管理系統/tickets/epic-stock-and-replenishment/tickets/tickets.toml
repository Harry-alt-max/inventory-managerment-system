description = "提供商品 × 位置 × 可用數量的庫存查詢清單（名稱部分關鍵字過濾、依位置展開各倉分布）與庫存異動紀錄查詢（依商品、日期、操作人員、用途過濾，僅追加不可修改）；查詢回應的庫存數量必須與各位置加總一致。"
